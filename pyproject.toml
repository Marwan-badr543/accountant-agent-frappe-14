[project]
name = "accountant_agent"
authors = [
    { name = "Marwan Badr", email = "marwanbadr514@gmail.com"}
]
description = "agent"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # frappe itself: installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Declares which Frappe/ERPNext this build targets, so `bench get-app` can
# check compatibility instead of assuming the same version as its sibling
# repo, razyyn-frappe-15 (declared frappe~=15.0.0 there, before that was even
# commented out here — this is the v14 counterpart, same app).
[tool.bench.frappe-dependencies]
frappe = ">=14.0.0,<15.0.0"
erpnext = ">=14.0.0,<15.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
